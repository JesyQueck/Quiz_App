<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="init_page">
      <h1>Quiz App</h1>
      <p>Test your knowledge on general questions</p>
      <button id="start_button">Start</button>
    </section>
    <section class="question_page">
      <header>
        <h1>Quiz App</h1>
        <div class="timer">
          <p class="sec">00</p>
        </div>
      </header>
      <div>
        <h2 class="question_no">
          Question <span id="current_question">0</span> of
          <span id="total_question">0</span>
        </h2>
        <h2 class="question">What is a table?</h2>
        <div class="options">
          <div class="opt1 opt">
            <input type="radio" name="option" id="option1" value="0" />
            <label class="label" for="option1">A thing</label>
          </div>
          <div class="opt2 opt">
            <input type="radio" name="option" id="option2" value="1" />
            <label class="label" for="option2">A name</label>
          </div>
          <div class="opt3 opt">
            <input type="radio" name="option" id="option3" value="2" />
            <label class="label" for="option3">An animal</label>
          </div>
          <div class="opt4 opt">
            <input type="radio" name="option" id="option4" value="3" />
            <label class="label" for="option4">A place</label>
          </div>
        </div>
        <div class="next-back_button">
          <button class="next">Next</button>
        </div>
        <div class="progress_bar"></div>
      </div>
    </section>
    <div class="modal_pop-up">
      <div class="score-card">
        <h3 class="score">Score: <span class="scoreId">0</span></h3>
        <h3 class="percent">Percentage: <span class="percentId">0</span></h3>
      </div>
      <div class="restart">
        <button class="restart_btn">Play Again</button>
        <!-- <div class="answer-screen">
          <h2>Answers</h2>
        </div> -->
      </div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
