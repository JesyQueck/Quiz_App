<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section>
    <header>
        <h1>Quiz App</h1>
            <div class="timer">
                <p class="sec">00</p>
            </div>
    </header>
    <div>
        <h2 class="question_no">Question <span id="current_question">0</span> of <span id="total_question"></span></h2>
        <h2 class="question">What is a table?</h2>
        <div class="options">
            <div class="opt1">
                <input type="radio" name="option" id="option1">
                <label class="label" for="">A thing</label>
            </div>
            <div class="opt2">
                <input type="radio" name="option" id="option2">
                <label class="label" for="">A name</label>
            </div>
            <div class="opt3">
                <input type="radio" name="option" id="option3">
                <label class="label" for="">An animal</label>
            </div>
            <div class="opt4">
                <input type="radio" name="option" id="option4">
                <label class="label" for="">A place</label>
            </div>            
        </div>
        <div class="next-back_button">
            <button class="next">Next</button>
            <button class="back">Back</button>
        </div>
        <div class="progress_bar"></div>
    </div>
    <div class="modal_pop-up">
        <div class="score-card">
            <h3 class="score"></h3>
            <h3 class="percent"></h3>
        </div>
        <div class="restart">
            <button>Play Again</button>
        </div>
    </div>
    </section>
    <script src="scripts.js"></script>
</body>
</html>
